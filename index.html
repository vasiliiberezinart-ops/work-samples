<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vasilii Berezin — Work Samples</title>
<style>
  :root{ --bg:#0f0f0e; --fg:#f2efe9; --dim:#8f8a80; --line:#2a2925; --accent:#b8ff3d; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Helvetica Neue",Inter,system-ui,sans-serif;line-height:1.55;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:56px 16px 96px}
  header{border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:44px}
  h1{font-size:clamp(28px,5vw,44px);margin:0 0 6px;letter-spacing:-.02em;font-weight:600}
  .sub{color:var(--dim);font-size:15px;margin:0}
  .meta{margin-top:18px;font-size:14px;color:var(--dim)}
  .meta a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
  .meta a:hover{border-bottom-color:var(--accent)}
  figure{margin:0 0 56px}
  figure img{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff}
  figcaption{margin-top:12px;font-size:14px;color:var(--dim)}
  figcaption b{color:var(--fg);font-weight:600}
  .n{display:inline-block;min-width:26px;color:var(--accent);font-variant-numeric:tabular-nums}
  footer{border-top:1px solid var(--line);padding-top:24px;font-size:14px;color:var(--dim)}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Vasilii Berezin</h1>
  <p class="sub">Binary BioTheater — visual support material</p>
  <p class="meta">
    Paris, France · <a href="mailto:vasiliyberezin.art@gmail.com">vasiliyberezin.art@gmail.com</a><br>
    <a href="https://vasiliiberezinart-ops.github.io/bezobrazov/">bezobrazov</a> ·
    <a href="https://vasiliiberezinart-ops.github.io/paintings/">paintings</a> ·
    <a href="https://www.youtube.com/@binarybiotheatre">recorded works</a>
  </p>
</header>

<figure>
  <img src="img/dossier_p01.jpg" alt="Binary BioTheater">
  <figcaption><span class="n">01</span> <b>Binary BioTheater</b>, founded 2016. A transdisciplinary collective: 41 productions, 400+ events, 300+ participants, most of them non-professionals.</figcaption>
</figure>

<figure>
  <img src="img/dossier_p02.jpg" alt="Opera Gospel, Devil Comedy, Adam Eve">
  <figcaption><span class="n">02</span> <b>Opera Gospel</b> — Saint Anne's Lutheran Church, Saint Petersburg, 2018. <b>Devil Comedy</b> after Dante — thirty-three separate city addresses, one spectator at a time, nine days, 2020; nominated for the Golden Mask.</figcaption>
</figure>

<figure>
  <img src="img/dossier_p05.jpg" alt="The Presentation of Self in Everyday Life; Pause and Reflect">
  <figcaption><span class="n">03</span> <b>The Presentation of Self in Everyday Life</b>, after Erving Goffman — installation and participation. <b>Pause and Reflect</b>.</figcaption>
</figure>

<figure>
  <img src="img/dossier_p07.jpg" alt="Peter and the Wolf; Opera Don Juan">
  <figcaption><span class="n">04</span> <b>Peter and the Wolf</b> — Wip Art Space, Moscow, 2021; Golden Mask finalist 2023. <b>Opera Don Juan</b> — Espaces d'Abraxas, Noisy-le-Grand, 2023.</figcaption>
</figure>

<figure>
  <img src="img/dossier_p08.jpg" alt="Institut FACT">
  <figcaption><span class="n">05</span> <b>FACT Institute</b>, founded 2016 — the education and community arm of the collective, working with participants outside professional training.</figcaption>
</figure>

<footer>
  Pages from the artistic dossier of Binary BioTheater. Full recordings of four complete productions are on the <a href="https://www.youtube.com/@binarybiotheatre">Binary Biotheatre channel</a>.
</footer>
</div>
</body>
</html>
